<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Page Not Found | SkillVault</title>
  <link rel="icon" href="assets/skillvault-logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .not-found{min-height:75vh;display:grid;place-items:center;padding:32px}
    .not-found-card{max-width:650px;text-align:center}
    .not-found-code{font:800 clamp(5rem,20vw,10rem)/1 Manrope,sans-serif;color:var(--accent)}
    .not-found h1{font-family:Manrope;font-size:clamp(2rem,5vw,4rem);letter-spacing:-.05em;margin:8px 0}
    .not-found p{color:var(--muted);line-height:1.7;margin-bottom:24px}
  </style>
  <link rel="stylesheet" href="css/premium.css">
</head>
<body>
  <main class="not-found">
    <div class="not-found-card">
      <div class="not-found-code">404</div>
      <h1>This page left the vault.</h1>
      <p>The page you opened does not exist, or its address has changed.</p>
      <a class="btn btn-primary" href="index.html">Back to SkillVault →</a>
    </div>
  </main>
  <script src="js/ui.js"></script>
</body>
</html>
